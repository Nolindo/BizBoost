
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizBoost | Welcome</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">Biz<span>Boost</span></a>
        <p>Discover. Connect. Grow.</p>
    </header>

    <main>
        <section class="account-section">
            <div class="account-container">

                <p class="eyebrow">YOUR BUSINESS. YOUR FUTURE.</p>

                <h2 id="accountTitle">Welcome to BizBoost</h2>

                <p id="accountDescription">
                    Join our community and discover opportunities
                    to grow your business.
                </p>

                <!-- Registration form -->
                <form id="registerForm" class="account-form">
                    <label for="registerName">Full name</label>
                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                    <label for="registerEmail">Email address</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button type="submit" class="contact-button">
                        Create Account
                    </button>

                    <p>Already have an account?</p>

                    <button
                        type="button"
                        id="showLoginButton"
                        class="account-switch"
                    >
                        Log in
                    </button>
                </form>

                <!-- Login form -->
                <form id="loginForm" class="account-form" hidden>
                    <label for="loginEmail">Email address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button type="submit" class="contact-button">
                        Log In
                    </button>

                    <p>New to BizBoost?</p>

                    <button
                        type="button"
                        id="showRegisterButton"
                        class="account-switch"
                    >
                        Create an account
                    </button>
                </form>

                <p id="authMessage" role="status" aria-live="polite"></p>

            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 BizBoost · Supporting young entrepreneurs</p>
    </footer>

    <script type="module" src="auth.js"></script>
</body>
</html>
